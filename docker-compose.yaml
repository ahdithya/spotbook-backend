services:
  postgres:
    image: postgres:16-alpine
    container_name: spotbook-postgres
    restart: always
    environment:
      POSTGRES_USER: spotbook_user
      POSTGRES_PASSWORD: spotbook_password
      POSTGRES_DB: SpotBookDb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spotbook-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  pg_data:
  redis_data:
